version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autoparts_db
    environment:
      POSTGRES_USER: autoparts
      POSTGRES_PASSWORD: autoparts_dev_password
      POSTGRES_DB: autoparts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoparts"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: autoparts_api
    environment:
      DATABASE_URL: postgresql://autoparts:autoparts_dev_password@db:5432/autoparts
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
